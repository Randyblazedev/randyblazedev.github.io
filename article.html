<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — RandyBlazeDev</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="bg-slate-100 dark:bg-gray-950 text-gray-700 dark:text-gray-300 font-['JetBrains_Mono']">
  <nav class="sticky top-0 z-50 w-full border-b border-black/5 dark:border-white/5 bg-white/80 dark:bg-gray-950/70 backdrop-blur-md px-6 py-4">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <a href="blog.html" class="text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-500 transition font-medium">← Back to Blog</a>
      <button id="theme-btn" class="px-3 py-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-700 dark:text-yellow-300 text-base transition hover:scale-105">🌙</button>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto px-6 py-12">
    <div id="loading" class="text-center text-gray-400 py-20">Loading article...</div>
    <div id="not-found" class="hidden text-center text-gray-400 py-20">Article not found.</div>

    <article id="article" class="hidden" data-aos="fade-up">
      <div class="flex items-center flex-wrap gap-3 text-xs text-gray-500 dark:text-gray-400 mb-6">
        <span id="cat-pill" class="px-3 py-1 rounded-full bg-blue-400/10 text-blue-600 dark:text-blue-400 font-semibold uppercase tracking-wide">News</span>
        <span id="post-date"></span>
        <span class="w-1 h-1 rounded-full bg-gray-400"></span>
        <span id="read-time"></span>
      </div>

      <h1 id="post-title" class="text-3xl sm:text-5xl font-bold text-gray-900 dark:text-white mb-8 leading-tight"></h1>

      <div id="post-content" class="space-y-5 text-base sm:text-lg text-gray-700 dark:text-gray-300 leading-relaxed article-body"></div>

      <!-- likes + comments -->
      <div class="mt-12 pt-8 border-t border-black/10 dark:border-white/10 flex items-center justify-center">
        <button id="like-btn" class="flex items-center gap-2 px-6 py-3 rounded-full bg-white dark:bg-white/[0.03] border border-gray-200 dark:border-white/10 text-gray-700 dark:text-gray-300 font-semibold text-sm transition-all duration-300 hover:scale-105 hover:border-pink-400/50 hover:shadow-lg" aria-pressed="false">
          <span id="like-icon" class="text-xl">🤍</span>
          <span>Like</span>
          <span id="like-count" class="text-gray-500 dark:text-gray-400 font-bold">0</span>
        </button>
      </div>

      <div class="mt-12">
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-6 border-l-4 border-blue-500 pl-4">Comments <span id="comment-total" class="text-base text-gray-500 dark:text-gray-400 font-medium"></span></h2>
        <form id="comment-form" class="space-y-3 mb-8">
          <input id="c-name" type="text" placeholder="Your name (optional)" maxlength="50" class="w-full px-4 py-3 rounded-xl bg-white dark:bg-white/[0.03] border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white text-sm outline-none focus:border-blue-500 transition">
          <textarea id="c-body" rows="3" placeholder="Leave a comment..." maxlength="1000" required class="w-full px-4 py-3 rounded-xl bg-white dark:bg-white/[0.03] border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white text-sm outline-none focus:border-blue-500 transition resize-none"></textarea>
          <button type="submit" class="px-6 py-2.5 rounded-full bg-blue-400 text-white font-semibold text-sm hover:bg-blue-500 transition">Post comment</button>
        </form>
        <div id="comment-list" class="space-y-4"></div>
        <p id="no-comments" class="text-center text-gray-500 dark:text-gray-400 text-sm py-6">No comments yet — be the first 🚀</p>
      </div>
    </article>
  </main>

  <script>
    const SUPABASE_URL = "https://bedyxwywkxwhkiiufvnm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0PA87lz20zFKUcDsvUdURg_X3f51fJ7";
    const BASE = SUPABASE_URL.replace(/\/$/, "");
    const LIKE_FN = `${BASE}/functions/v1/like-post`;
    const COMMENT_FN = `${BASE}/functions/v1/post-comments`;

    const slug = new URLSearchParams(window.location.search).get("slug") || "";
    const POST_KEY = slug || "post";

    // theme
    const html = document.documentElement;
    const themeBtn = document.getElementById("theme-btn");
    if (localStorage.theme !== "light") html.classList.add("dark");
    function renderBtn(){ themeBtn.textContent = html.classList.contains("dark") ? "🌙" : "☀️"; }
    themeBtn.addEventListener("click", () => { html.classList.toggle("dark"); localStorage.theme = html.classList.contains("dark") ? "dark" : "light"; renderBtn(); });
    renderBtn();

    async function loadPost() {
      let data = null;
      try {
        const res = await fetch(SUPABASE_URL + "/rest/v1/posts?select=*&slug=eq." + encodeURIComponent(slug), {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }
        });
        const arr = await res.json();
        if (res.ok && Array.isArray(arr) && arr.length) data = arr[0];
      } catch (e) {}
      if (!data) { document.getElementById("loading").classList.add("hidden"); document.getElementById("not-found").classList.remove("hidden"); return; }
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("article").classList.remove("hidden");

      document.title = data.title + " — RandyBlazeDev";
      document.getElementById("post-title").textContent = data.title;
      document.getElementById("post-date").textContent = new Date(data.date).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
      const catLabel = { journey: "My Journey", tutorials: "Tutorials", news: "Tech News", projects: "Projects" }[data.category] || data.category;
      document.getElementById("cat-pill").textContent = catLabel;
      const words = data.content.replace(/<[^>]*>/g, " ").split(/\s+/).filter(Boolean).length;
      document.getElementById("read-time").textContent = Math.max(1, Math.round(words / 200)) + " min read";

      // strip any embedded like/comment section that got saved into the post body
      let clean = data.content;
      const embedMarkers = ['class="mt-10 pt-8 border-t', 'id="like-btn"', 'id="comment-form"'];
      for (const m of embedMarkers) {
        const idx = clean.indexOf(m);
        if (idx > -1) {
          // back up to the nearest preceding "</p>" or "</div>" boundary
          const cut = clean.lastIndexOf('</p>', idx);
          const cut2 = clean.lastIndexOf('</div>', idx);
          const at = Math.max(cut, cut2);
          clean = clean.slice(0, at > -1 ? at : idx).replace(/\s+$/, '');
          break;
        }
      }
      document.getElementById("post-content").innerHTML = clean;
      document.querySelectorAll("#post-content h1, #post-content h2").forEach(h => {
        h.className = "text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white mt-12 mb-4 border-l-4 border-blue-500 pl-4";
      });
      document.querySelectorAll("#post-content p").forEach(p => { p.className += " mb-4"; });
      document.querySelectorAll("#post-content pre").forEach(pre => {
        pre.className = "bg-gray-900 dark:bg-black text-gray-100 rounded-lg p-5 font-mono text-sm leading-relaxed overflow-x-auto mb-6 shadow-lg";
      });
      document.querySelectorAll("#post-content blockquote").forEach(b => {
        b.className = "border-l-4 border-blue-500 pl-4 italic text-gray-600 dark:text-gray-400 my-8";
      });
      document.querySelectorAll("#post-content ul").forEach(u => { u.className = "space-y-3 mb-6 list-disc pl-5"; });

      loadLikes();
      loadComments();
    }

    // likes
    const likeBtn = document.getElementById("like-btn");
    const likeIcon = document.getElementById("like-icon");
    const likeCount = document.getElementById("like-count");
    let likedState = false;
    function renderLikes(){ likeIcon.textContent = likedState ? "🩷" : "🤍"; likeBtn.setAttribute("aria-pressed", likedState); }
    const FN_HEADERS = { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY };
    async function loadLikes(){ try { const r = await fetch(`${LIKE_FN}?post_key=${POST_KEY}`, { headers: FN_HEADERS }); const d = await r.json(); likeCount.textContent = d.count ?? 0; likedState = !!d.liked; renderLikes(); } catch {} }
    likeBtn.addEventListener("click", async () => {
      if (likedState) return; // already liked — one per person
      try {
        const r = await fetch(`${LIKE_FN}?post_key=${POST_KEY}`, { method: "POST", headers: FN_HEADERS });
        const d = await r.json();
        likeCount.textContent = d.count ?? likeCount.textContent;
        likedState = !!d.liked;
        renderLikes();
      } catch {}
    });

    // comments
    const form = document.getElementById("comment-form");
    const nameInput = document.getElementById("c-name");
    const bodyInput = document.getElementById("c-body");
    const listEl = document.getElementById("comment-list");
    const noComments = document.getElementById("no-comments");
    const totalEl = document.getElementById("comment-total");
    function timeAgo(iso){ const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000); if (s < 60) return "just now"; const m = Math.floor(s / 60); if (m < 60) return m + "m ago"; const h = Math.floor(m / 60); if (h < 24) return h + "h ago"; const d = Math.floor(h / 24); if (d < 30) return d + "d ago"; return new Date(iso).toLocaleDateString(); }
    function esc(str){ return String(str).replace(/[&<>"']/g, s => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s])); }
    async function loadComments(){ try { const r = await fetch(`${COMMENT_FN}?post_key=${POST_KEY}`, { headers: FN_HEADERS }); const d = await r.json(); const c = d.comments || []; totalEl.textContent = c.length ? "(" + c.length + ")" : ""; noComments.style.display = c.length ? "none" : "block"; listEl.innerHTML = c.map(x => `<div class="p-4 rounded-2xl bg-white dark:bg-white/[0.03] border border-gray-200/80 dark:border-white/5"><div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mb-1"><span class="font-bold text-blue-500">${esc(x.name)}</span><span>·</span><span>${timeAgo(x.created_at)}</span></div><p class="text-sm text-gray-700 dark:text-gray-300 leading-relaxed">${esc(x.comment)}</p></div>`).join(""); } catch {} }
    form.addEventListener("submit", async (e) => { e.preventDefault(); const comment = bodyInput.value.trim(); if (!comment) return; const name = nameInput.value.trim() || "Anonymous"; try { await fetch(`${COMMENT_FN}?post_key=${POST_KEY}`, { method: "POST", headers: { ...FN_HEADERS, "Content-Type": "application/json" }, body: JSON.stringify({ name, comment }) }); bodyInput.value = ""; loadComments(); } catch {} });

    loadPost();
    AOS.init({ duration: 600 });
  </script>
</body>
</html>
