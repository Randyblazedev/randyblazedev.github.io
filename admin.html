<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Admin — RandyBlazeDev</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-950 text-gray-300 font-['JetBrains_Mono']">
  <!-- PASSWORD GATE -->
  <div id="login-screen" class="max-w-sm mx-auto px-6 py-24 text-center">
    <h1 class="text-2xl font-['Inter'] font-bold text-white mb-2">Blog Admin</h1>
    <p class="text-sm text-gray-400 mb-6">Enter password to continue</p>
    <form id="login-form" class="space-y-3">
      <input type="password" id="admin-pass" placeholder="Password" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-white/10 text-white text-sm outline-none focus:border-blue-500 transition text-center">
      <button type="submit" class="w-full py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-['Inter'] font-semibold transition">Unlock</button>
    </form>
    <p id="login-msg" class="hidden mt-3 text-sm text-red-400">Wrong password</p>
  </div>

  <!-- ADMIN (hidden until unlocked) -->
  <div id="admin-screen" class="max-w-3xl mx-auto px-6 py-12 hidden">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-['Inter'] font-bold text-white">Blog Admin</h1>
      <div class="flex items-center gap-4">
        <a href="blog.html" class="text-sm text-blue-400 hover:text-blue-300 transition">← View blog</a>
        <button id="logout-btn" class="text-xs text-gray-500 hover:text-red-400 transition">Logout</button>
      </div>
    </div>

    <!-- ===== SETUP: put YOUR Supabase URL + anon key here ===== -->
    <div id="config" data-url="https://bedyxwywkxwhkiiufvnm.supabase.co" data-key="sb_publishable_0PA87lz20zFKUcDsvUdURg_X3f51fJ7" class="hidden"></div>

    <!-- form message -->
    <div id="form-msg" class="hidden mb-4 px-4 py-3 rounded-xl text-sm"></div>

    <!-- NEW POST FORM -->
    <form id="post-form" class="space-y-4 bg-white/[0.02] border border-white/5 rounded-2xl p-6">
      <div>
        <label for="title" class="block text-xs font-['Inter'] font-medium text-gray-400 mb-2">Title</label>
        <input type="text" id="title" required placeholder="Post title" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-white/10 text-white text-sm outline-none focus:border-blue-500 transition">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="slug" class="block text-xs font-['Inter'] font-medium text-gray-400 mb-2">Slug (url)</label>
          <input type="text" id="slug" required placeholder="my-post-title" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-white/10 text-white text-sm outline-none focus:border-blue-500 transition">
        </div>
        <div>
          <label for="category" class="block text-xs font-['Inter'] font-medium text-gray-400 mb-2">Category</label>
          <select id="category" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-white/10 text-white text-sm outline-none focus:border-blue-500 transition">
            <option value="journey">My Journey</option>
            <option value="tutorials">Tutorials</option>
            <option value="news">Tech News</option>
            <option value="projects">Projects</option>
          </select>
        </div>
      </div>
      <div>
        <label for="excerpt" class="block text-xs font-['Inter'] font-medium text-gray-400 mb-2">Excerpt (short description)</label>
        <input type="text" id="excerpt" required placeholder="One or two sentence summary" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-white/10 text-white text-sm outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label for="content" class="block text-xs font-['Inter'] font-medium text-gray-400 mb-2">Content (HTML allowed)</label>
        <textarea id="content" rows="12" required placeholder="&lt;p&gt;Write your article here... use &lt;h2&gt;, &lt;p&gt;, &lt;pre&gt; etc.&lt;/p&gt;" class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-white/10 text-white text-sm outline-none focus:border-blue-500 transition resize-y font-mono"></textarea>
        <p class="text-xs text-gray-600 mt-1">Write HTML directly. h2 / p / pre / ul / blockquote all work.</p>
      </div>
      <button type="submit" class="w-full py-3.5 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-['Inter'] font-semibold transition">Save Post</button>
    </form>

    <!-- POST LIST -->
    <div class="mt-12">
      <h2 class="text-xl font-['Inter'] font-bold text-white mb-4">Existing Posts</h2>
      <div id="post-list" class="space-y-3"></div>
    </div>
  </div>

  <script>
    // ---- PASSWORD GATE ----
    const ADMIN_PASS = "rblazedev";
    const loginScreen = document.getElementById("login-screen");
    const adminScreen = document.getElementById("admin-screen");
    const loginForm = document.getElementById("login-form");
    const passInput = document.getElementById("admin-pass");
    const loginMsg = document.getElementById("login-msg");

    // stay logged in for this session (sessionStorage may be blocked in preview)
    let sessionOk = false;
    try { sessionOk = sessionStorage.getItem("admin_ok") === "1"; } catch (e) {}
    if (sessionOk) { loginScreen.classList.add("hidden"); adminScreen.classList.remove("hidden"); }

    function tryUnlock() {
      if (passInput.value === ADMIN_PASS) {
        try { sessionStorage.setItem("admin_ok", "1"); } catch (e) {}
        loginScreen.classList.add("hidden");
        adminScreen.classList.remove("hidden");
        try { loadPosts(); } catch (e) {}
      } else {
        loginMsg.classList.remove("hidden");
        passInput.value = "";
      }
    }

    // attach to both submit AND click for reliability
    loginForm.addEventListener("submit", (e) => { e.preventDefault(); tryUnlock(); });
    const loginBtn = loginForm.querySelector("button");
    if (loginBtn) loginBtn.addEventListener("click", (e) => { e.preventDefault(); tryUnlock(); });

    document.getElementById("logout-btn").addEventListener("click", () => {
      try { sessionStorage.removeItem("admin_ok"); } catch (e) {}
      adminScreen.classList.add("hidden");
      loginScreen.classList.remove("hidden");
    });

    const cfg = document.getElementById("config");
    const SUPABASE_URL = cfg.dataset.url;
    const SUPABASE_KEY = cfg.dataset.key;
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const form = document.getElementById("post-form");
    const msg = document.getElementById("form-msg");
    const listEl = document.getElementById("post-list");

    function showMsg(text, ok = true) {
      msg.textContent = text;
      msg.className = "mb-4 px-4 py-3 rounded-xl text-sm " + (ok ? "bg-emerald-500/10 border border-emerald-500/30 text-emerald-300" : "bg-red-500/10 border border-red-500/30 text-red-300");
      msg.classList.remove("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const post = {
        title: document.getElementById("title").value.trim(),
        slug: document.getElementById("slug").value.trim().toLowerCase().replace(/\s+/g, "-"),
        category: document.getElementById("category").value,
        excerpt: document.getElementById("excerpt").value.trim(),
        content: document.getElementById("content").value,
        date: new Date().toISOString().slice(0, 10),
      };
      if (!post.title || !post.slug || !post.excerpt || !post.content) { showMsg("All fields required", false); return; }
      const { error } = await supabase.from("posts").insert(post);
      if (error) { showMsg("Error: " + error.message, false); return; }
      showMsg("Post saved ✅");
      form.reset();
      loadPosts();
    });

    async function loadPosts() {
      const { data, error } = await supabase.from("posts").select("*").order("created_at", { ascending: false });
      if (error || !data) { listEl.innerHTML = '<p class="text-gray-500 text-sm">Could not load posts. Check your Supabase keys.</p>'; return; }
      if (!data.length) { listEl.innerHTML = '<p class="text-gray-500 text-sm">No posts yet.</p>'; return; }
      listEl.innerHTML = data.map(p => `
        <div class="flex items-center justify-between gap-4 bg-white/[0.02] border border-white/5 rounded-xl p-4">
          <div class="min-w-0">
            <div class="font-['Inter'] font-semibold text-white text-sm truncate">${p.title}</div>
            <div class="text-xs text-gray-500 mt-0.5">${p.category} · ${p.date} · /${p.slug}</div>
          </div>
          <div class="flex gap-2 shrink-0">
            <a href="article.html?slug=${p.slug}" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-xs text-gray-300 hover:bg-white/10 transition">View</a>
            <button data-del="${p.id}" class="px-3 py-1.5 rounded-lg bg-red-500/10 border border-red-500/30 text-xs text-red-300 hover:bg-red-500/20 transition">Delete</button>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this post?")) return;
          const { error } = await supabase.from("posts").delete().eq("id", btn.dataset.del);
          if (error) { showMsg("Delete failed", false); return; }
          showMsg("Post deleted");
          loadPosts();
        });
      });
    }

    // only load posts if already unlocked (login handler calls it too)
    if (sessionStorage.getItem("admin_ok") === "1") loadPosts();
  </script>
</body>
</html>
