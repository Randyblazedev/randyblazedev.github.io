<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Blog — RandyBlazeDev</title>
  <meta name="description" content="Read RandyBlazeDev developer stories, frontend tutorials, and technology news.">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    @variant dark (&:where(.dark, .dark *));
  </style>
</head>
<body class="bg-slate-100 dark:bg-gray-950 text-gray-700 dark:text-gray-300 font-['JetBrains_Mono']">
  <nav class="sticky top-0 z-50 w-full border-b border-black/5 dark:border-white/5 bg-white/80 dark:bg-gray-950/70 backdrop-blur-md px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <button id="theme-btn" class="px-3 py-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-700 dark:text-yellow-300 text-base transition hover:scale-105">🌙</button>
      <a href="index.html" class="text-gray-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-500 transition font-medium">← Back to home</a>
    </div>
  </nav>

  <h1 class="text-4xl text-center font-bold text-blue-400 mt-8">Developer Blog</h1>
  <p class="text-center mt-2 font-bold mb-6 text-xl text-gray-900 dark:text-white">Stories, tutorials and tech news</p>

  <div class="flex flex-wrap justify-center gap-3 mb-6 px-4">
    <button class="filter-btn px-5 py-2 rounded-full bg-blue-400 text-white transition hover:scale-105" data-category="all">All</button>
    <button class="filter-btn px-5 py-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-900 dark:text-white transition hover:bg-blue-400 hover:text-white" data-category="journey">My Journey</button>
    <button class="filter-btn px-5 py-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-900 dark:text-white transition hover:bg-blue-400 hover:text-white" data-category="projects">Projects</button>
    <button class="filter-btn px-5 py-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-900 dark:text-white transition hover:bg-blue-400 hover:text-white" data-category="tutorials">Tutorials</button>
    <button class="filter-btn px-5 py-2 rounded-full bg-gray-200 dark:bg-slate-800 text-gray-900 dark:text-white transition hover:bg-blue-400 hover:text-white" data-category="news">News</button>
  </div>

  <p id="no-blogs" class="hidden text-center text-gray-500 dark:text-gray-400 text-xl mt-6">No blogs found in this category 🚀</p>

  <section class="max-w-5xl mx-auto p-4 grid md:grid-cols-2 gap-6">
    <p id="loading" class="text-center text-gray-400 py-10 col-span-full">Loading posts...</p>
    <div id="post-grid" class="grid md:grid-cols-2 gap-6 md:col-span-full"></div>
  </section>

  <script>
    const SUPABASE_URL = "https://bedyxwywkxwhkiiufvnm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0PA87lz20zFKUcDsvUdURg_X3f51fJ7";

    // theme
    const html = document.documentElement;
    const themeBtn = document.getElementById("theme-btn");
    if (localStorage.theme !== "light") html.classList.add("dark");
    function renderThemeBtn(){ themeBtn.textContent = html.classList.contains("dark") ? "🌙" : "☀️"; }
    themeBtn.addEventListener("click", () => { html.classList.toggle("dark"); localStorage.theme = html.classList.contains("dark") ? "dark" : "light"; renderThemeBtn(); });
    renderThemeBtn();

    const noBlogs = document.getElementById("no-blogs");
    const grid = document.getElementById("post-grid");
    const loading = document.getElementById("loading");
    let posts = [];

    function readTime(p){
      const words = (p.content || "").trim().split(/\s+/).length;
      const min = Math.max(1, Math.round(words / 200));
      return min + " min read";
    }
    function fmtDate(d){
      return new Date(d).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
    }
    function cardHTML(p){
      return `
        <a href="article.html?slug=${p.slug}" class="block group p-6 bg-white dark:bg-white/[0.02] border border-gray-200/80 dark:border-white/5 rounded-2xl transition-all duration-300 ease-out hover:border-indigo-500/30 hover:shadow-[0_15px_30px_rgba(99,102,241,0.04)]" data-category="${p.category}">
          <div class="flex items-center gap-3 text-xs font-medium text-gray-500 dark:text-gray-400 mb-3">
            <span>${fmtDate(p.date)}</span><span class="w-1 h-1 rounded-full bg-gray-300 dark:bg-gray-700"></span><span>${readTime(p)}</span>
          </div>
          <h3 class="text-xl font-bold text-gray-900 dark:text-white group-hover:text-indigo-500 transition-colors duration-200 mb-2">${p.title}</h3>
          <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed mb-4">${p.excerpt}</p>
          <div class="inline-flex items-center gap-1 text-xs font-semibold text-indigo-500 group-hover:translate-x-1 transition-transform duration-200">Read Article
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          </div>
        </a>
      `;
    }

    function render(filter = "all"){
      const f = posts.filter(p => filter === "all" || p.category === filter);
      if (loading.parentNode) loading.remove();
      noBlogs.classList.toggle("hidden", f.length !== 0);
      grid.innerHTML = f.map(cardHTML).join("");
    }

    async function loadPosts(){
      try {
        const res = await fetch(SUPABASE_URL + "/rest/v1/posts?select=*&order=created_at.desc", {
          headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "HTTP " + res.status);
        posts = data;
        render("all");
      } catch (e) {
        loading.textContent = "Could not load posts: " + e.message;
      }
    }

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(btn => {
          btn.classList.remove("bg-blue-400", "text-white");
          btn.classList.add("bg-gray-200", "dark:bg-slate-800", "text-gray-900", "dark:text-white");
        });
        button.classList.remove("bg-gray-200", "dark:bg-slate-800", "text-gray-900", "dark:text-white");
        button.classList.add("bg-blue-400", "text-white");
        render(button.dataset.category);
      });
    });

    loadPosts();
  </script>
</body>
</html>
